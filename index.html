<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f4f6" />
  <title>AI Daily Brief</title>
  <style>
    :root {
      --bg:#f4f4f6;
      --card:#fff;
      --text:#1d1d1f;
      --muted:#74747a;
      --line:#e7e7ea;
      --dark:#161617;
      --accent:#0066cc;
      --soft:#f7f7f9;
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .wrap {
      width:min(920px, calc(100% - 34px));
      margin:0 auto;
      padding:34px 0 72px;
    }

    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:34px;
    }

    .brand-mini {
      font-size:12px;
      font-weight:800;
      letter-spacing:.14em;
      color:#8b8b91;
      text-transform:uppercase;
    }

    .fx {
      display:flex;
      align-items:baseline;
      gap:8px;
      white-space:nowrap;
    }

    .fx-label {
      font-size:12px;
      font-weight:750;
      color:#8b8b91;
    }

    .fx-value {
      font-size:20px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .fx-date {
      font-size:11px;
      color:#a2a2a8;
    }

    .fx-panel {
      margin-top:18px;
      padding:18px 20px 14px;
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(0,0,0,.035);
      box-shadow:0 2px 12px rgba(0,0,0,.02);
    }

    .fx-panel-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
    }

    .fx-panel-title {
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      color:#6f6f75;
    }

    .fx-panel-change {
      font-size:12px;
      font-weight:750;
      color:#6f6f75;
    }

    .fx-chart-wrap {
      height:92px;
      width:100%;
    }

    .fx-chart {
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .fx-chart-line {
      fill:none;
      stroke:#1d1d1f;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      vector-effect:non-scaling-stroke;
    }

    .fx-chart-area {
      fill:rgba(29,29,31,.055);
    }

    .fx-chart-dot {
      fill:#1d1d1f;
    }

    .fx-chart-labels {
      display:flex;
      justify-content:space-between;
      margin-top:6px;
      font-size:10px;
      color:#a0a0a6;
    }

    .headline h1 {
      margin:0;
      font-size:clamp(44px,7vw,70px);
      line-height:.98;
      letter-spacing:-.055em;
    }

    .meta {
      margin-top:13px;
      font-size:13px;
      color:#929298;
    }

    .daily-summary {
      margin-top:23px;
      font-size:clamp(17px,2.2vw,21px);
      line-height:1.55;
      letter-spacing:-.02em;
    }

    .hero {
      margin-top:30px;
      padding:30px 32px;
      border-radius:24px;
      background:var(--dark);
      color:#fff;
    }

    .hero-label {
      font-size:11px;
      font-weight:800;
      letter-spacing:.09em;
      color:#a9a9ae;
    }

    .hero h2 {
      margin:11px 0 8px;
      font-size:clamp(25px,3.8vw,37px);
      line-height:1.22;
      letter-spacing:-.035em;
    }

    .hero p {
      margin:0;
      color:#d4d4d8;
      font-size:15px;
      line-height:1.65;
    }

    .section-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:22px 0 12px;
      color:#96969c;
      font-size:12px;
    }

    .grid {
      display:grid;
      gap:14px;
    }

    .card {
      background:var(--card);
      border-radius:20px;
      padding:25px 26px 23px;
      border:1px solid rgba(0,0,0,.035);
      box-shadow:0 2px 12px rgba(0,0,0,.025);
    }

    .card-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .num {
      font-size:11px;
      font-weight:800;
      color:#a0a0a6;
      letter-spacing:.06em;
    }

    .tag {
      padding:6px 10px;
      border-radius:999px;
      background:#f1f1f3;
      font-size:11px;
      font-weight:750;
      color:#626268;
    }

    .card h3 {
      margin:15px 0 8px;
      font-size:clamp(21px,3vw,27px);
      line-height:1.3;
      letter-spacing:-.028em;
    }

    .summary {
      margin:0;
      font-size:16px;
      line-height:1.55;
      font-weight:650;
    }

    .detail {
      margin:10px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.68;
    }

    .why {
      margin-top:15px;
      padding:13px 15px;
      border-radius:13px;
      background:var(--soft);
      font-size:13px;
      line-height:1.58;
      color:#56565c;
    }

    .why b {
      color:var(--text);
    }

    .source-row {
      margin-top:15px;
      padding-top:14px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:11px;
      color:#98989e;
    }

    .source-row a {
      color:var(--accent);
      font-weight:750;
      text-decoration:none;
      white-space:nowrap;
    }

    footer {
      margin-top:25px;
      text-align:center;
      font-size:11px;
      line-height:1.6;
      color:#a1a1a7;
    }

    .error {
      background:#fff;
      padding:20px;
      border-radius:16px;
      color:#77777d;
      font-size:14px;
      line-height:1.6;
    }

    @media (max-width:600px) {
      .wrap {
        width:min(100% - 22px,920px);
        padding-top:22px;
      }

      .topbar {
        align-items:flex-start;
        margin-bottom:26px;
      }

      .fx {
        flex-wrap:wrap;
        justify-content:flex-end;
        gap:4px 7px;
      }

      .fx-value { font-size:18px; }

      .hero {
        padding:24px 22px;
        border-radius:20px;
      }

      .card {
        padding:21px 19px 19px;
      }

      .source-row {
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-mini">Daily AI Intelligence</div>

      <div class="fx" title="일일 기준환율">
        <span class="fx-label">USD/KRW</span>
        <span class="fx-value" id="fxValue">-</span>
        <span class="fx-date" id="fxDate"></span>
      </div>
    </div>

    <section class="fx-panel" id="fxPanel" hidden>
      <div class="fx-panel-head">
        <span class="fx-panel-title">USD/KRW · 최근 7영업일</span>
        <span class="fx-panel-change" id="fxChange"></span>
      </div>
      <div class="fx-chart-wrap">
        <svg class="fx-chart" id="fxChart" viewBox="0 0 800 100" preserveAspectRatio="none" aria-label="USD KRW 최근 7영업일 환율 그래프"></svg>
      </div>
      <div class="fx-chart-labels">
        <span id="fxStartDate"></span>
        <span id="fxEndDate"></span>
      </div>
    </section>

    <header class="headline">
      <h1>AI Daily Brief</h1>
      <div class="meta" id="dateText">최신 브리핑 불러오는 중…</div>
      <div class="daily-summary" id="daySummary">
        오늘 알아둘 AI 업계 핵심 이슈를 자동으로 선별해 보여줍니다.
      </div>
    </header>

    <section class="hero" id="hero" hidden>
      <div class="hero-label">TODAY'S TOP ISSUE</div>
      <h2 id="heroTitle"></h2>
      <p id="heroSummary"></p>
    </section>

    <div class="section-head">
      <span>오늘의 핵심 이슈</span>
      <span id="issueCount"></span>
    </div>

    <main class="grid" id="issueList"></main>

    <footer>
      AI 요약은 원문과 다를 수 있습니다. 중요한 내용은 각 카드의 원문을 확인하세요.
    </footer>
  </div>

  <script>
    const escapeHtml = (value = "") =>
      String(value).replace(/[&<>"']/g, ch => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[ch]));

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        return ["http:","https:"].includes(parsed.protocol) ? parsed.href : "#";
      } catch { return "#"; }
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      const d = new Date(dateString + "T12:00:00");
      if (Number.isNaN(d.getTime())) return dateString;
      return new Intl.DateTimeFormat("ko-KR", {
        year:"numeric", month:"long", day:"numeric", weekday:"short"
      }).format(d);
    }


    function renderFxChart(history) {
      if (!Array.isArray(history) || history.length < 2) return;

      const rows = history
        .map(x => ({ date: String(x.date || ""), rate: Number(x.rate) }))
        .filter(x => x.date && Number.isFinite(x.rate));

      if (rows.length < 2) return;

      const svg = document.getElementById("fxChart");
      const width = 800;
      const height = 100;
      const padX = 8;
      const padY = 12;

      const values = rows.map(x => x.rate);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const spread = Math.max(max - min, 1);

      const points = rows.map((row, i) => {
        const x = padX + (i / (rows.length - 1)) * (width - padX * 2);
        const y = padY + ((max - row.rate) / spread) * (height - padY * 2);
        return { ...row, x, y };
      });

      const linePath = "M " + points.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ");
      const areaPath =
        `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${height} ` +
        `L ${points[0].x.toFixed(1)} ${height} Z`;

      svg.innerHTML = `
        <path class="fx-chart-area" d="${areaPath}"></path>
        <path class="fx-chart-line" d="${linePath}"></path>
        ${points.map((p, i) =>
          i === points.length - 1
            ? `<circle class="fx-chart-dot" cx="${p.x}" cy="${p.y}" r="3.6"></circle>`
            : ""
        ).join("")}
      `;

      const first = rows[0];
      const last = rows[rows.length - 1];
      const change = last.rate - first.rate;
      const pct = first.rate ? (change / first.rate) * 100 : 0;
      const sign = change > 0 ? "+" : "";

      document.getElementById("fxChange").textContent =
        `${sign}${change.toFixed(2)}원 (${sign}${pct.toFixed(2)}%)`;

      const shortDate = d => {
        const parts = d.split("-");
        return parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : d;
      };

      document.getElementById("fxStartDate").textContent = shortDate(first.date);
      document.getElementById("fxEndDate").textContent = shortDate(last.date);
      document.getElementById("fxPanel").hidden = false;
    }

    async function loadBrief() {
      const list = document.getElementById("issueList");

      try {
        const response = await fetch(`./news.json?v=${Date.now()}`, { cache:"no-store" });
        if (!response.ok) throw new Error("news.json을 불러오지 못했습니다.");
        const data = await response.json();

        document.getElementById("dateText").textContent =
          `${formatDate(data.date)} · ${data.updated_at || ""}`;

        document.getElementById("daySummary").textContent =
          data.daily_summary || "오늘의 AI 핵심 이슈입니다.";

        if (data.exchange_rate && data.exchange_rate.usd_krw) {
          const rate = Number(data.exchange_rate.usd_krw);
          document.getElementById("fxValue").textContent =
            Number.isFinite(rate)
              ? `${rate.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원`
              : "-";
          document.getElementById("fxDate").textContent =
            data.exchange_rate.date ? `· ${data.exchange_rate.date}` : "";
        }

        if (Array.isArray(data.exchange_rate_history)) {
          renderFxChart(data.exchange_rate_history);
        }

        const issues = Array.isArray(data.issues) ? data.issues : [];
        document.getElementById("issueCount").textContent = `${issues.length}개`;

        if (!issues.length) {
          list.innerHTML = '<div class="error">아직 오늘의 브리핑이 생성되지 않았습니다.</div>';
          return;
        }

        const top = issues[0];
        document.getElementById("heroTitle").textContent = top.title || "";
        document.getElementById("heroSummary").textContent = top.summary || "";
        document.getElementById("hero").hidden = false;

        list.innerHTML = issues.map((item, idx) => {
          const url = safeUrl(item.source_url);
          return `
            <article class="card">
              <div class="card-top">
                <span class="num">${String(idx + 1).padStart(2,"0")}</span>
                <span class="tag">${escapeHtml(item.category || "AI")}</span>
              </div>
              <h3>${escapeHtml(item.title)}</h3>
              <p class="summary">${escapeHtml(item.summary)}</p>
              <p class="detail">${escapeHtml(item.detail)}</p>
              <div class="why"><b>왜 중요한가?</b><br>${escapeHtml(item.why_it_matters)}</div>
              <div class="source-row">
                <span>${escapeHtml(item.source_name || "출처")} · ${escapeHtml(item.published_date || "")}</span>
                ${url !== "#" ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">원문 보기 →</a>` : ""}
              </div>
            </article>
          `;
        }).join("");

      } catch (err) {
        list.innerHTML = `<div class="error">브리핑을 불러오지 못했습니다.<br>${escapeHtml(err.message)}</div>`;
      }
    }

    loadBrief();
  </script>
</body>
</html>
