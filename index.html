<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f4f6" />
  <title>AI Daily Brief</title>
  <style>
    :root {
      --bg:#f4f4f6;
      --card:#fff;
      --text:#1d1d1f;
      --muted:#74747a;
      --line:#e7e7ea;
      --dark:#161617;
      --accent:#0066cc;
      --soft:#f7f7f9;
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .wrap {
      width:min(920px, calc(100% - 34px));
      margin:0 auto;
      padding:34px 0 72px;
    }

    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:34px;
    }

    .brand-mini {
      font-size:12px;
      font-weight:800;
      letter-spacing:.14em;
      color:#8b8b91;
      text-transform:uppercase;
    }

    .fx {
      display:flex;
      align-items:baseline;
      gap:8px;
      white-space:nowrap;
    }

    .fx-label {
      font-size:12px;
      font-weight:750;
      color:#8b8b91;
    }

    .fx-value {
      font-size:20px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .fx-date {
      font-size:11px;
      color:#a2a2a8;
    }

    .fx-panel {
      margin-top:18px;
      padding:18px 20px 14px;
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(0,0,0,.035);
      box-shadow:0 2px 12px rgba(0,0,0,.02);
    }

    .fx-panel-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
    }

    .fx-panel-title {
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      color:#6f6f75;
    }

    .fx-panel-change {
      font-size:12px;
      font-weight:750;
      color:#6f6f75;
    }

    .fx-chart-wrap {
      height:122px;
      width:100%;
    }

    .fx-chart {
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .fx-chart-line {
      fill:none;
      stroke:#1d1d1f;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      vector-effect:non-scaling-stroke;
    }

    .fx-chart-area {
      fill:rgba(29,29,31,.055);
    }

    .fx-chart-dot {
      fill:#1d1d1f;
    }

    .fx-chart-labels {
      display:flex;
      justify-content:space-between;
      margin-top:6px;
      font-size:10px;
      color:#a0a0a6;
    }

    .headline h1 {
      margin:0;
      font-size:clamp(44px,7vw,70px);
      line-height:.98;
      letter-spacing:-.055em;
    }

    .meta {
      margin-top:13px;
      font-size:13px;
      color:#929298;
    }

    .daily-summary {
      margin-top:23px;
      font-size:clamp(17px,2.2vw,21px);
      line-height:1.55;
      letter-spacing:-.02em;
    }

    .hero {
      margin-top:30px;
      padding:30px 32px;
      border-radius:24px;
      background:var(--dark);
      color:#fff;
    }

    .hero-label {
      font-size:11px;
      font-weight:800;
      letter-spacing:.09em;
      color:#a9a9ae;
    }

    .hero h2 {
      margin:11px 0 8px;
      font-size:clamp(25px,3.8vw,37px);
      line-height:1.22;
      letter-spacing:-.035em;
    }

    .hero p {
      margin:0;
      color:#d4d4d8;
      font-size:15px;
      line-height:1.65;
    }

    .section-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:22px 0 12px;
      color:#96969c;
      font-size:12px;
    }

    .grid {
      display:grid;
      gap:14px;
    }

    .card {
      background:var(--card);
      border-radius:20px;
      padding:25px 26px 23px;
      border:1px solid rgba(0,0,0,.035);
      box-shadow:0 2px 12px rgba(0,0,0,.025);
    }

    .card-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .num {
      font-size:11px;
      font-weight:800;
      color:#a0a0a6;
      letter-spacing:.06em;
    }

    .tag {
      padding:6px 10px;
      border-radius:999px;
      background:#f1f1f3;
      font-size:11px;
      font-weight:750;
      color:#626268;
    }

    .card h3 {
      margin:15px 0 8px;
      font-size:clamp(21px,3vw,27px);
      line-height:1.3;
      letter-spacing:-.028em;
    }

    .summary {
      margin:0;
      font-size:16px;
      line-height:1.55;
      font-weight:650;
    }

    .detail {
      margin:10px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.68;
    }

    .why {
      margin-top:15px;
      padding:13px 15px;
      border-radius:13px;
      background:var(--soft);
      font-size:13px;
      line-height:1.58;
      color:#56565c;
    }

    .why b {
      color:var(--text);
    }

    .source-row {
      margin-top:15px;
      padding-top:14px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:11px;
      color:#98989e;
    }

    .source-row a {
      color:var(--accent);
      font-weight:750;
      text-decoration:none;
      white-space:nowrap;
    }

    footer {
      margin-top:25px;
      text-align:center;
      font-size:11px;
      line-height:1.6;
      color:#a1a1a7;
    }

    .error {
      background:#fff;
      padding:20px;
      border-radius:16px;
      color:#77777d;
      font-size:14px;
      line-height:1.6;
    }


    .fx-tooltip{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-115%);
      padding:7px 9px;border-radius:9px;background:#1d1d1f;color:#fff;font-size:11px;line-height:1.35;
      white-space:nowrap;opacity:0;transition:opacity .12s ease}
    .fx-chart-hit{fill:transparent;cursor:pointer}
    .fx-chart-date{font-size:8.5px;fill:#99999f;text-anchor:middle}
    .fx-extreme-label{font-size:9px;font-weight:700;fill:#66666c;text-anchor:middle}

    .history{margin-top:34px}
    .history-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
    .history-title{font-size:19px;font-weight:800;letter-spacing:-.02em}
    .history-sub{margin-top:4px;font-size:12px;color:#96969c}
    .calendar{background:#fff;border-radius:20px;padding:18px;border:1px solid rgba(0,0,0,.035)}
    .calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .calendar-month{font-size:15px;font-weight:800}
    .calendar-top button{width:30px;height:30px;border:1px solid #e6e6e8;border-radius:9px;background:#fff;
      color:#444449;cursor:pointer;font-size:15px}
    .calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .calendar-weekdays{margin-bottom:5px;color:#a0a0a6;font-size:10px;text-align:center}
    .calendar-day{min-height:42px;border:0;border-radius:10px;background:transparent;color:#b0b0b5;
      font-size:12px;position:relative;display:flex;align-items:center;justify-content:center}
    button.calendar-day{cursor:pointer;color:#343438}
    button.calendar-day:hover{background:#f4f4f6}
    .calendar-day.has-news::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;
      border-radius:50%;background:#1d1d1f;transform:translateX(-50%)}
    .calendar-day.selected{background:#1d1d1f;color:#fff;font-weight:800}
    .calendar-day.selected::after{background:#fff}
    .history-detail{margin-top:10px;background:#fff;border-radius:20px;padding:20px 22px;
      border:1px solid rgba(0,0,0,.035)}
    .history-detail-date{font-size:12px;color:#8f8f95;margin-bottom:12px}
    .history-list{margin:0;padding:0;list-style:none}
    .history-list li{padding:11px 0;border-top:1px solid #ededee;font-size:15px;line-height:1.45;font-weight:650}
    .history-list li:first-child{border-top:0;padding-top:0}
    .history-empty{color:#9a9aa0;font-size:13px}


    .update-alert {
      margin-top:14px;
      padding:13px 15px;
      border-radius:13px;
      background:#fff8e8;
      border:1px solid #f1dfb2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-size:12px;
      line-height:1.5;
      color:#6c5a2e;
    }
    .update-alert[hidden] { display:none; }
    .retry-btn {
      flex:0 0 auto;
      border:0;
      border-radius:10px;
      padding:9px 12px;
      background:#1d1d1f;
      color:#fff;
      font-size:12px;
      font-weight:750;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
    }
    .retry-btn:hover { opacity:.88; }

    @media (max-width:600px) {
      .wrap {
        width:min(100% - 22px,920px);
        padding-top:22px;
      }

      .topbar {
        align-items:flex-start;
        margin-bottom:26px;
      }

      .fx {
        flex-wrap:wrap;
        justify-content:flex-end;
        gap:4px 7px;
      }

      .fx-value { font-size:18px; }

      .hero {
        padding:24px 22px;
        border-radius:20px;
      }

      .card {
        padding:21px 19px 19px;
      }

      .source-row {
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-mini">Daily AI Intelligence</div>

      <div class="fx" title="일일 기준환율">
        <span class="fx-label">USD/KRW</span>
        <span class="fx-value" id="fxValue">-</span>
        <span class="fx-date" id="fxDate"></span>
      </div>
    </div>

    <section class="fx-panel" id="fxPanel" hidden>
      <div class="fx-panel-head">
        <span class="fx-panel-title">USD/KRW · 최근 7영업일</span>
        <span class="fx-panel-change" id="fxChange"></span>
      </div>
      <div class="fx-chart-wrap">
        <svg class="fx-chart" id="fxChart" viewBox="0 0 800 100" preserveAspectRatio="none" aria-label="USD KRW 최근 7영업일 환율 그래프"></svg>
      </div>
</section>

    <header class="headline">
      <h1>AI Daily Brief</h1>
      <div class="meta" id="dateText">최신 브리핑 불러오는 중…</div>
      <div class="update-alert" id="updateAlert" hidden>
        <span id="updateAlertText"></span>
        <a class="retry-btn"
           href="https://github.com/jaemin882-sys/ai-daily-brief/actions/workflows/update-news.yml"
           target="_blank"
           rel="noopener noreferrer">AI 다시 생성</a>
      </div>
      <div class="daily-summary" id="daySummary">
        오늘 알아둘 AI 업계 핵심 이슈를 자동으로 선별해 보여줍니다.
      </div>
    </header>

    <section class="hero" id="hero" hidden>
      <div class="hero-label">TODAY'S TOP ISSUE</div>
      <h2 id="heroTitle"></h2>
      <p id="heroSummary"></p>
    </section>

    <div class="section-head">
      <span>오늘의 핵심 이슈</span>
      <span id="issueCount"></span>
    </div>

    <main class="grid" id="issueList"></main>


    <section class="history">
      <div class="history-head">
        <div>
          <div class="history-title">AI Brief History</div>
          <div class="history-sub">날짜를 누르면 그날의 주요 제목만 볼 수 있습니다.</div>
        </div>
      </div>
      <div class="calendar">
        <div class="calendar-top">
          <button type="button" id="prevMonth" aria-label="이전 달">‹</button>
          <div class="calendar-month" id="calendarMonth"></div>
          <button type="button" id="nextMonth" aria-label="다음 달">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="history-detail" id="historyDetail" hidden>
        <div class="history-detail-date" id="historyDetailDate"></div>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </section>

    <footer>
      AI 요약은 원문과 다를 수 있습니다. 중요한 내용은 각 카드의 원문을 확인하세요.
    </footer>
  </div>

  <script>
    const escapeHtml = (value = "") =>
      String(value).replace(/[&<>"']/g, ch => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[ch]));

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        return ["http:","https:"].includes(parsed.protocol) ? parsed.href : "#";
      } catch { return "#"; }
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      const d = new Date(dateString + "T12:00:00");
      if (Number.isNaN(d.getTime())) return dateString;
      return new Intl.DateTimeFormat("ko-KR", {
        year:"numeric", month:"long", day:"numeric", weekday:"short"
      }).format(d);
    }


    function renderFxChart(history) {
      if (!Array.isArray(history) || history.length < 2) return;
      const rows = history.map(x=>({date:String(x.date||""),rate:Number(x.rate)}))
        .filter(x=>x.date&&Number.isFinite(x.rate));
      if (rows.length < 2) return;

      const svg=document.getElementById("fxChart");
      const tooltip=document.getElementById("fxTooltip");
      const width=800,height=122,padX=34,chartTop=18,chartBottom=78;
      const values=rows.map(x=>x.rate);
      const min=Math.min(...values),max=Math.max(...values),spread=Math.max(max-min,1);

      const points=rows.map((row,i)=>({
        ...row,
        x:padX+(i/(rows.length-1))*(width-padX*2),
        y:chartTop+((max-row.rate)/spread)*(chartBottom-chartTop)
      }));

      const linePath="M "+points.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ");
      const areaPath=`${linePath} L ${points.at(-1).x.toFixed(1)} ${chartBottom+5} L ${points[0].x.toFixed(1)} ${chartBottom+5} Z`;
      const maxIndex=values.indexOf(max),minIndex=values.indexOf(min);
      const shortDate=d=>{const p=d.split("-");return p.length===3?`${Number(p[1])}/${Number(p[2])}`:d};

      svg.innerHTML=`
        <path class="fx-chart-area" d="${areaPath}"></path>
        <path class="fx-chart-line" d="${linePath}"></path>
        ${points.map((p,i)=>`
          <circle cx="${p.x}" cy="${p.y}" r="3" fill="#1d1d1f"></circle>
          <circle class="fx-chart-hit" data-index="${i}" cx="${p.x}" cy="${p.y}" r="16"></circle>
          <text class="fx-chart-date" x="${p.x}" y="108">${shortDate(p.date)}</text>
        `).join("")}
        <text class="fx-extreme-label" x="${points[maxIndex].x}" y="${Math.max(10,points[maxIndex].y-9)}">
          최고 ${max.toLocaleString("ko-KR",{maximumFractionDigits:2})}
        </text>
        <text class="fx-extreme-label" x="${points[minIndex].x}" y="${Math.min(94,points[minIndex].y+15)}">
          최저 ${min.toLocaleString("ko-KR",{maximumFractionDigits:2})}
        </text>
      `;

      svg.querySelectorAll(".fx-chart-hit").forEach(hit=>{
        const show=ev=>{
          const p=points[Number(hit.dataset.index)];
          tooltip.textContent=`${p.date} · ${p.rate.toLocaleString("ko-KR",{maximumFractionDigits:2})}원`;
          tooltip.style.left=`${ev.clientX}px`; tooltip.style.top=`${ev.clientY}px`; tooltip.style.opacity="1";
        };
        hit.addEventListener("mouseenter",show); hit.addEventListener("mousemove",show);
        hit.addEventListener("mouseleave",()=>tooltip.style.opacity="0");
      });

      const first=rows[0],last=rows.at(-1),change=last.rate-first.rate,pct=first.rate?(change/first.rate)*100:0;
      const sign=change>0?"+":"";
      document.getElementById("fxChange").textContent=`${sign}${change.toFixed(2)}원 (${sign}${pct.toFixed(2)}%)`;
      document.getElementById("fxPanel").hidden=false;
    }

    let historyDates=[];
    let calendarCursor=new Date();

    function renderCalendar(){
      const grid=document.getElementById("calendarGrid");
      const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth();
      document.getElementById("calendarMonth").textContent=`${year}년 ${month+1}월`;

      const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
      const available=new Set(historyDates),cells=[];
      for(let i=0;i<firstDay.getDay();i++) cells.push('<span class="calendar-day"></span>');

      for(let day=1;day<=lastDay.getDate();day++){
        const date=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        cells.push(available.has(date)
          ? `<button type="button" class="calendar-day has-news" data-date="${date}">${day}</button>`
          : `<span class="calendar-day">${day}</span>`);
      }
      grid.innerHTML=cells.join("");

      grid.querySelectorAll("button[data-date]").forEach(btn=>{
        btn.addEventListener("click",async()=>{
          grid.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));
          btn.classList.add("selected");
          await loadHistoryDate(btn.dataset.date);
        });
      });
    }

    async function loadHistoryIndex(){
      try{
        const r=await fetch(`./history/index.json?v=${Date.now()}`,{cache:"no-store"});
        if(!r.ok)return;
        const data=await r.json();
        historyDates=Array.isArray(data.dates)?data.dates:[];
        if(historyDates.length){
          const p=historyDates.at(-1).split("-").map(Number);
          calendarCursor=new Date(p[0],p[1]-1,1);
        }
        renderCalendar();
      }catch(e){console.warn(e)}
    }

    async function loadHistoryDate(date){
      const detail=document.getElementById("historyDetail");
      const dateEl=document.getElementById("historyDetailDate");
      const list=document.getElementById("historyList");
      try{
        const r=await fetch(`./history/${date}.json?v=${Date.now()}`,{cache:"no-store"});
        if(!r.ok)throw new Error();
        const data=await r.json();
        const issues=Array.isArray(data.issues)?data.issues:[];
        dateEl.textContent=formatDate(date);
        list.innerHTML=issues.length
          ? issues.map(x=>`<li>${escapeHtml(x.title||"")}</li>`).join("")
          : '<li class="history-empty">저장된 이슈가 없습니다.</li>';
      }catch(e){
        dateEl.textContent=formatDate(date);
        list.innerHTML='<li class="history-empty">이 날짜의 기록을 불러오지 못했습니다.</li>';
      }
      detail.hidden=false;
    }

    async function loadBrief() {
      const list = document.getElementById("issueList");

      try {
        const response = await fetch(`./news.json?v=${Date.now()}`, { cache:"no-store" });
        if (!response.ok) throw new Error("news.json을 불러오지 못했습니다.");
        const data = await response.json();

        document.getElementById("dateText").textContent =
          `${formatDate(data.date)} · ${data.updated_at || ""}`;

        document.getElementById("daySummary").textContent =
          data.daily_summary || "오늘의 AI 핵심 이슈입니다.";

        const updateAlert = document.getElementById("updateAlert");
        const updateAlertText = document.getElementById("updateAlertText");
        if (data.update_status && data.update_status.ok === false) {
          updateAlertText.textContent =
            data.update_status.message ||
            "오늘 AI 요약 업데이트에 실패했습니다. 마지막 정상 브리핑을 표시하고 있습니다.";
          updateAlert.hidden = false;
        } else {
          updateAlert.hidden = true;
        }

        if (data.exchange_rate && data.exchange_rate.usd_krw) {
          const rate = Number(data.exchange_rate.usd_krw);
          document.getElementById("fxValue").textContent =
            Number.isFinite(rate)
              ? `${rate.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원`
              : "-";
          document.getElementById("fxDate").textContent =
            data.exchange_rate.date ? `· ${data.exchange_rate.date}` : "";
        }

        if (Array.isArray(data.exchange_rate_history)) {
          renderFxChart(data.exchange_rate_history);
        }

        const issues = Array.isArray(data.issues) ? data.issues : [];
        document.getElementById("issueCount").textContent = `${issues.length}개`;

        if (!issues.length) {
          list.innerHTML = '<div class="error">아직 오늘의 브리핑이 생성되지 않았습니다.</div>';
          return;
        }

        const top = issues[0];
        document.getElementById("heroTitle").textContent = top.title || "";
        document.getElementById("heroSummary").textContent = top.summary || "";
        document.getElementById("hero").hidden = false;

        list.innerHTML = issues.map((item, idx) => {
          const url = safeUrl(item.source_url);
          return `
            <article class="card">
              <div class="card-top">
                <span class="num">${String(idx + 1).padStart(2,"0")}</span>
                <span class="tag">${escapeHtml(item.category || "AI")}</span>
              </div>
              <h3>${escapeHtml(item.title)}</h3>
              <p class="summary">${escapeHtml(item.summary)}</p>
              <p class="detail">${escapeHtml(item.detail)}</p>
              <div class="why"><b>왜 중요한가?</b><br>${escapeHtml(item.why_it_matters)}</div>
              <div class="source-row">
                <span>${escapeHtml(item.source_name || "출처")} · ${escapeHtml(item.published_date || "")}</span>
                ${url !== "#" ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">원문 보기 →</a>` : ""}
              </div>
            </article>
          `;
        }).join("");

      } catch (err) {
        list.innerHTML = `<div class="error">브리핑을 불러오지 못했습니다.<br>${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("prevMonth").addEventListener("click",()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);renderCalendar();});
    document.getElementById("nextMonth").addEventListener("click",()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);renderCalendar();});
    loadBrief();
    loadHistoryIndex();
  </script>
</body>
</html>
