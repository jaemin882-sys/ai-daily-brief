<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>AI Daily Brief</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255,255,255,.92);
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #e5e5e7;
      --accent: #0071e3;
      --dark: #161617;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(1040px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 64px 0 34px; }
    .eyebrow {
      font-size: 13px; font-weight: 800; letter-spacing: .12em;
      color: var(--sub); text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .98; letter-spacing: -.055em;
    }
    .meta { margin-top: 18px; color: var(--sub); font-size: 15px; }
    .intro {
      margin-top: 26px; max-width: 770px;
      font-size: clamp(18px, 2.5vw, 23px);
      line-height: 1.55; letter-spacing: -.02em;
    }
    .hero {
      margin: 8px 0 22px;
      border-radius: 28px;
      padding: clamp(28px, 5vw, 48px);
      background: var(--dark); color: white;
      box-shadow: 0 20px 50px rgba(0,0,0,.09);
    }
    .hero-label { color: #a1a1a6; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .hero h2 {
      margin: 13px 0 12px;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1.18; letter-spacing: -.035em;
    }
    .hero p { color: #d2d2d7; font-size: 17px; line-height: 1.65; margin: 0; }
    .grid { display: grid; gap: 18px; }
    .card {
      border: 1px solid rgba(0,0,0,.04);
      border-radius: 24px;
      padding: clamp(24px, 4vw, 34px);
      background: var(--card);
      box-shadow: 0 3px 18px rgba(0,0,0,.035);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .num { font-weight: 800; color: #98989d; font-size: 13px; letter-spacing: .06em; }
    .tag {
      background: #f0f0f2; border-radius: 999px;
      padding: 7px 11px; font-size: 12px; font-weight: 750; color: #515154;
    }
    .card h3 {
      margin: 18px 0 10px;
      font-size: clamp(23px, 3.5vw, 31px);
      line-height: 1.27; letter-spacing: -.03em;
    }
    .summary {
      margin: 0 0 15px;
      font-size: 18px; line-height: 1.6; font-weight: 650;
    }
    .detail {
      margin: 0; color: var(--sub);
      font-size: 16px; line-height: 1.75;
    }
    .why {
      margin-top: 20px; padding: 16px 18px;
      background: #f7f7f9; border-radius: 15px;
      font-size: 14px; line-height: 1.65; color: #515154;
    }
    .why b { color: var(--text); }
    .source-row {
      margin-top: 20px; padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 13px; color: var(--sub);
    }
    .source-row a {
      color: var(--accent); text-decoration: none; font-weight: 700; white-space: nowrap;
    }
    .source-row a:hover { text-decoration: underline; }
    footer {
      padding: 34px 0 70px; text-align: center; color: #98989d;
      font-size: 12px; line-height: 1.7;
    }
    .status {
      margin: 22px 0;
      color: var(--sub);
      font-size: 14px;
    }
    .error {
      background: white; border-radius: 18px; padding: 22px;
      color: #6e6e73; line-height: 1.6;
    }
    @media (max-width: 600px) {
      header { padding-top: 42px; }
      .wrap { width: min(100% - 24px, 1040px); }
      .source-row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Daily AI Intelligence</div>
      <h1>AI Daily Brief</h1>
      <div class="meta" id="dateText">최신 브리핑 불러오는 중…</div>
      <div class="intro" id="daySummary">
        오늘 알아둘 AI 업계의 핵심 이슈를 자동으로 선별해 보여줍니다.
      </div>
    </header>

    <section class="hero" id="hero" hidden>
      <div class="hero-label">TODAY'S TOP ISSUE</div>
      <h2 id="heroTitle"></h2>
      <p id="heroSummary"></p>
    </section>

    <div class="status" id="status">뉴스 데이터를 불러오고 있습니다.</div>
    <main class="grid" id="issueList"></main>

    <footer>
      매일 자동 생성되는 AI 뉴스 브리핑 · AI 요약은 원문과 다를 수 있으므로 중요한 내용은 출처를 확인하세요.
    </footer>
  </div>

  <script>
    const escapeHtml = (value = "") =>
      String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[ch]));

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : "#";
      } catch {
        return "#";
      }
    }

    function formatDate(dateString) {
      if (!dateString) return "업데이트 날짜 없음";
      const d = new Date(dateString + "T12:00:00");
      if (Number.isNaN(d.getTime())) return dateString;
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      }).format(d);
    }

    async function loadBrief() {
      const status = document.getElementById("status");
      const list = document.getElementById("issueList");

      try {
        const response = await fetch(`./news.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("news.json을 불러오지 못했습니다.");
        const data = await response.json();

        document.getElementById("dateText").textContent =
          `${formatDate(data.date)} · ${data.updated_at || ""}`;
        document.getElementById("daySummary").textContent =
          data.daily_summary || "오늘의 AI 핵심 이슈입니다.";

        const issues = Array.isArray(data.issues) ? data.issues : [];

        if (issues.length === 0) {
          status.innerHTML = '<div class="error">아직 브리핑이 생성되지 않았습니다. GitHub Actions에서 <b>Update AI Daily Brief</b>를 한 번 실행해주세요.</div>';
          return;
        }

        const top = issues[0];
        document.getElementById("heroTitle").textContent = top.title || "";
        document.getElementById("heroSummary").textContent = top.summary || "";
        document.getElementById("hero").hidden = false;

        list.innerHTML = issues.map((item, idx) => {
          const url = safeUrl(item.source_url);
          const sourceLink = url === "#"
            ? ""
            : `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">원문 보기 →</a>`;

          return `
            <article class="card">
              <div class="card-top">
                <span class="num">${String(idx + 1).padStart(2, "0")}</span>
                <span class="tag">${escapeHtml(item.category || "AI")}</span>
              </div>
              <h3>${escapeHtml(item.title)}</h3>
              <p class="summary">${escapeHtml(item.summary)}</p>
              <p class="detail">${escapeHtml(item.detail)}</p>
              <div class="why"><b>왜 중요한가?</b><br>${escapeHtml(item.why_it_matters)}</div>
              <div class="source-row">
                <span>${escapeHtml(item.source_name || "출처")} · ${escapeHtml(item.published_date || "")}</span>
                ${sourceLink}
              </div>
            </article>`;
        }).join("");

        status.textContent = `${issues.length}개의 핵심 이슈를 표시하고 있습니다.`;
      } catch (err) {
        console.error(err);
        status.innerHTML = `<div class="error">브리핑을 불러오지 못했습니다.<br>${escapeHtml(err.message)}</div>`;
      }
    }

    loadBrief();
  </script>
</body>
</html>
